name: Build GameBootloader EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Libraries
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 psutil pywin32 pyinstaller

    - name: Build Standalone EXE
      shell: pwsh
      run: |
        # Tìm file code python chính trong repo
        $targetFile = Get-ChildItem -Filter "*.py" | Where-Object { $_.Name -like "*QT*" -or $_.Name -like "*Bootloader*" } | Select-Object -First 1
        
        if (-not $targetFile) {$targetFile = Get-ChildItem -Filter "*.py" | Select-Object -First 1
        }

        Write-Host "Dang dong goi file: $($targetFile.Name)"

        # Kiem tra icon hop le
        $iconArg = ""
        if (Test-Path "app_icon.ico") {
            $iconArg = "--icon=app_icon.ico"
        }

        # Chay dong goi PyInstaller
        pyinstaller --onefile --noconsole $iconArg `
          --collect-all PyQt5 `
          --collect-all win32gui `
          --collect-all win32ui `
          --hidden-import=win32timezone `
          --name="GameBootloader" `
          "$($targetFile.FullName)"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GameBootloader-EXE
        path: dist/GameBootloader.exe
