name: Build Mir4 Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 pywin32 pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --collect-all PyQt5 --collect-all win32gui --hidden-import win32timezone --hidden-import win32gui --hidden-import win32con Mir4WallManager.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mir4WallManager-EXE
        path: dist/Mir4WallManager.exe
