name: Build GameBootloader EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Libraries
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 psutil pywin32 pyinstaller

    - name: Build Standalone EXE
      run: |
        pyinstaller --onefile --noconsole --collect-all PyQt5 --collect-all win32gui --collect-all win32ui --hidden-import=win32timezone --name="GameBootloader" "AUTO START QT vs TINKER.py"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GameBootloader-EXE
        path: dist/GameBootloader.exe
